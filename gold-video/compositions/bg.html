  <script>
    (function () {
      var tl = gsap.timeline({ paused: true });
      // deterministic dust field (seeded)
      var seed = 7;
      function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
      var host = document.getElementById("bg-dust");
      var dots = [];
      for (var i = 0; i < 26; i++) {
        var d = document.createElement("div");

        var s = 3 + Math.round(rnd() * 6);

        d.style.opacity = (0.18 + rnd() * 0.4).toFixed(2);
        host.appendChild(d);
        dots.push({ el: d, dy: 120 + rnd() * 260, dx: (rnd() - 0.5) * 80 });
      }
      dots.forEach(function (o) {
        tl.fromTo(o.el, { y: 0, x: 0 }, { y: -o.dy, x: o.dx, duration: 44, ease: "none" }, 0);
      });
      // lighting: key light travels from top-left to top-right, flares on the result reveal and on the CTA
